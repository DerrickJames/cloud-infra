upstream app {
	server appName1736363323:80;
}

server {
	listen 80;

	root /var/www/html/public;

	index index.html index.htm index.nginx-debian.html;

	server_name devapi.appName.com;

	charset utf-8;
	server_tokens off;
	client_max_body_size 50M;

	location / {
		if ($http_x_forwarded_proto != 'https') {
			rewrite ^ https://$host$request_uri? permanent;
		}

   		add_header 'Access-Control-Allow-Origin' '*' always;
   		add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS, DELETE, PUT, PATCH' always;
		add_header 'Access-Control-Max-Age' '1000' always;
   		add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
   		add_header 'Access-Control-Allow-Headers' 'Authorization, x-requested-with, Content-Type, origin, authorization, accept, client-security-token' always;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# proxy_set_header X-Forwarded-Proto $scheme;

		proxy_pass http://app;
		proxy_redirect off;

		# Handle Web Socket connections
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location /api-tools/swagger {
		if ($http_x_forwarded_proto != 'https') {
			rewrite ^ https://$host$request_uri? permanent;
		}

   		add_header 'Access-Control-Allow-Origin' '*' always;
   		add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS, DELETE, PUT, PATCH' always;
		add_header 'Access-Control-Max-Age' '1000' always;
   		add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
   		add_header 'Access-Control-Allow-Headers' 'Authorization, x-requested-with, Content-Type, origin, authorization, accept, client-security-token' always;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# proxy_set_header X-Forwarded-Proto $scheme;

		proxy_pass http://app;
		proxy_redirect off;

		# Handle Web Socket connections
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

}
